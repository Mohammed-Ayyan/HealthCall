services:
  # 1. MongoDB Database
  mongodb:
    image: mongo:7.0
    container_name: careops-mongodb
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. AI Intelligence Engine (FastAPI + Whisper + Ollama/Heuristic Triage)
  ai-engine:
    build:
      context: ./ai-engine
      dockerfile: Dockerfile
    container_name: careops-ai-engine
    restart: always
    ports:
      - "8000:8000"
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - CORS_ORIGINS=["http://localhost:3000","http://127.0.0.1:3000"]
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # 3. Express / Node.js Backend Core & RBAC Services
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: careops-backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - DATABASE_URL=mongodb://mongodb:27017/careops
      - JWT_SECRET=careops_production_super_secret_jwt_key_2026
      - NODE_ENV=production
    depends_on:
      mongodb:
        condition: service_healthy

  # 4. Next.js Frontend Application
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: careops-frontend
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:5000/api/v1
      - NEXT_PUBLIC_AI_ENGINE_URL=http://localhost:8000/api/v1
    depends_on:
      - backend
      - ai-engine

volumes:
  mongo_data:
    driver: local
